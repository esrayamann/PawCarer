# PawCarer — Docker Compose
# Backend + Redis (cache) + RabbitMQ (mesaj kuyruğu) + Jenkins (CI/CD) servisleri

services:
  # ─── Backend (Next.js + Prisma) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawcarer-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pawcarer-network
    restart: unless-stopped

  # ─── Redis (Cache) ───
  redis:
    image: redis:7-alpine
    container_name: pawcarer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawcarer-network
    restart: unless-stopped

  # ─── RabbitMQ (Mesaj Kuyruğu) ───
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pawcarer-rabbitmq
    ports:
      - "5672:5672"     # AMQP protokolü
      - "15672:15672"   # Yönetim paneli (Web UI)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - pawcarer-network
    restart: unless-stopped

  # ─── Jenkins (CI/CD) ───
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: pawcarer-jenkins
    user: root
    ports:
      - "8080:8080"   # Web UI
      - "50000:50000" # Agent bağlantı portu
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-out-of-Docker (DooD)
    environment:
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-PawCarer2026!}
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - pawcarer-network
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:
  jenkins-data:

networks:
  pawcarer-network:
    driver: bridge
