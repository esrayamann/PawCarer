# ─── PawCarer CI/CD Pipeline ───
# Her push ve pull request'te otomatik çalışır

name: PawCarer CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Job 1: Build & Lint ───
  build-and-lint:
    name: 🏗️ Build & Lint
    runs-on: ubuntu-latest

    # ─── Servis Container'ları (Redis + RabbitMQ) ───
    # Build sırasında gerçek Redis ve RabbitMQ servisleri ayağa kalkar
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: ./backend
        run: npm run lint || true

      - name: 🔨 Build Next.js application
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: npm run build

      - name: ✅ Build successful
        run: echo "Backend build completed successfully!"

  # ─── Job 2: Docker Build Test ───
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        working-directory: ./backend
        run: |
          docker build -t pawcarer-backend:test .
          echo "Docker image built successfully!"

      - name: 🐳 Test Docker Compose
        run: |
          docker compose config
          echo "Docker Compose configuration is valid!"

  # ─── Job 3: Mobile Build Check ───
  mobile-check:
    name: 📱 Mobile Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install mobile dependencies
        working-directory: ./mobile
        run: npm install

      - name: 🔍 TypeScript type check
        working-directory: ./mobile
        run: npx tsc --noEmit || true

      - name: ✅ Mobile check complete
        run: echo "Mobile type check completed!"
